name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # We specify the working directory in case this template is used within a monorepo.
    # Otherwise, you can remove this block if it's the root of the repository.
    # defaults:
    #   run:
    #     working-directory: ./go-gin-template-v1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Build API
      run: go build -v ./cmd/api

    - name: Run Unit Tests
      run: go test -v ./...
